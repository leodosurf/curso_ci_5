name: LoadTest

on:
  workflow_call:

jobs:

  loadtest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: configurando credenciais da AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
        aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
        aws-region: us-east-1

    - run: git clone https://github.com/leodosurf/Infra_CI

#.  - name: HashiCorp - Setup Terraform
#     uses: hashicorp/setup-terraform@v2.0.3
	  
#    - run: terraform -chdir=Infra_CI/env/Homolog init

#    - run: terraform -chdir=Infra_CI/env/Homolog plan

    - name: Setup Python 
      uses: actions/setup-python@v6.2.0
      with:
        python-version: 3.15.0
    
    - uses: BSFishy/pip-action@v1
      with: 
        packages: |
          locust