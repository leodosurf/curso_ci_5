name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ubuntu-latest
    env:
      HOST: localhost
      DBPORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
    strategy:
      matrix:
        go_version: ['1.18']
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for DB
      run: |
        while ! curl -s telnet://localhost:5432 > /dev/null; do
          echo "Waiting for service..."
          sleep 5
        done

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go
    - name: Upload main compilado
      uses: actions/upload-artifact@v7.0.0
      with:
        name: programa
        path: main

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit

#  EC2:
#    needs: build
#    uses: ./.github/workflows/EC2.yml
#    secrets: inherit

  ECS:
    needs: build
    uses: ./.github/workflows/ECS.yml
    secrets: inherit